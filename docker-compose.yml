version: '3.8'

services:
  pedagogical-vision-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pedagogical-vision-backend
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - SERVER__HOST=0.0.0.0
      - SERVER__PORT=8088
      - LAYERS__TEMPORAL_FUSION__SLIDING_WINDOW_SECONDS=10.0
    volumes:
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
